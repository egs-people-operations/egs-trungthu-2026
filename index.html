  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ercase; color: #FFD966; font-weight: 600; margin-bottom: 10px;\">{{ dashState }}<\u002Fdiv>\n              <div style=\"font-size: clamp(34px, 5vw, 62px); font-weight: 800; line-height: 1.02; letter-spacing: -.02em; text-shadow: 0 2px 18px rgba(24,22,66,.9);\">Bảng xếp hạng<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: clamp(14px, 2.4vw, 28px); flex-wrap: wrap; align-items: flex-end;\">\n              <div style=\"text-align: right;\">\n                <div style=\"font-size: clamp(11px, 1.2vw, 13px); letter-spacing: .12em; text-transform: uppercase; color: #AEB8CA; font-weight: 600; margin-bottom: 6px;\">Room code<\u002Fdiv>\n                <div style=\"font-family: var(--font-mono); font-size: clamp(32px, 4.6vw, 56px); font-weight: 500; letter-spacing: .14em; line-height: 1;\">{{ dashCode }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ dashStats }}\" as=\"st\" hint-placeholder-count=\"3\">\n                <div style=\"text-align: right; min-width: 88px;\">\n                  <div style=\"font-size: clamp(11px, 1.2vw, 13px); letter-spacing: .12em; text-transform: uppercase; color: #AEB8CA; font-weight: 600; margin-bottom: 6px;\">{{ st.label }}<\u002Fdiv>\n                  <div style=\"font-family: var(--font-mono); font-size: clamp(26px, 3.4vw, 40px); font-weight: 500; line-height: 1;\">{{ st.value }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: inline-block; padding: 7px 14px; border-radius: 999px; background: rgba(24,22,66,.78); font-size: clamp(13px, 1.5vw, 17px); color: #C9D6E8; margin-bottom: clamp(16px, 2.4vw, 24px); overflow-wrap: anywhere;\">{{ dashLink }}<\u002Fdiv>\n\n          <sc-if value=\"{{ dashEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"border: 1px dashed rgba(255,255,255,.24); border-radius: 10px; padding: clamp(28px, 5vw, 56px); text-align: center; font-size: clamp(15px, 1.8vw, 20px); color: #AEB8CA; background: rgba(24,22,66,.62);\">{{ dashEmptyNote }}<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display: grid; gap: 10px;\">\n            <sc-for list=\"{{ dashRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n              <div style=\"display: grid; grid-template-columns: clamp(44px, 5vw, 68px) minmax(0, 1fr) auto; gap: clamp(12px, 2vw, 24px); align-items: center; padding: clamp(11px, 1.6vw, 18px) clamp(14px, 2.2vw, 24px); border-radius: 10px; border: 1px solid rgba(255,255,255,.12); background: {{ row.bg }};\">\n                <div style=\"font-family: var(--font-mono); font-size: clamp(22px, 3vw, 38px); font-weight: 500; color: {{ row.medal }}; line-height: 1;\">{{ row.rank }}<\u002Fdiv>\n                <div style=\"min-width: 0;\">\n                  <div style=\"font-size: clamp(19px, 2.6vw, 34px); font-weight: 700; line-height: 1.15; overflow-wrap: anywhere;\">{{ row.name }}<\u002Fdiv>\n                  <div style=\"font-size: clamp(12px, 1.4vw, 17px); color: #AEB8CA; margin-top: 4px;\">{{ row.detail }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-family: var(--font-mono); font-size: clamp(24px, 3.4vw, 44px); font-weight: 500; line-height: 1; white-space: nowrap;\">{{ row.score }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isRoster }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"width: min(920px, 100%); margin: 0 auto; animation: egsRise .5s cubic-bezier(.16,1,.3,1) both;\">\n          <sc-if value=\"{{ testBadge }}\" hint-placeholder-val=\"\">\n            <div style=\"display: inline-block; padding: 7px 14px; border-radius: 999px; background: rgba(242,169,59,.18); border: 1px solid rgba(242,169,59,.45); color: #F2A93B; font-size: 13px; font-weight: 600; margin-bottom: 18px;\">{{ testBadge }}<\u002Fdiv>\n          <\u002F yle=\"margin-top: 20px; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; background: rgba(24,22,66,.92); box-shadow: 0 4px 12px rgba(0,0,0,.28); padding: clamp(18px, 3vw, 24px);\">\n                <div style=\"font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #AEB8CA; font-weight: 600; margin-bottom: 16px;\">You are the host<\u002Fdiv>\n                <div style=\"display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px;\">\n                  <div>\n                    <div style=\"font-size: 12px; color: #AEB8CA; margin-bottom: 6px;\">Room code<\u002Fdiv>\n                    <div style=\"font-family: var(--font-mono); font-size: clamp(30px, 7vw, 40px); font-weight: 500; letter-spacing: .14em; color: #FFFFFF; line-height: 1; overflow-wrap: anywhere;\">{{ roomCode }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <button type=\"button\" sc-camel-on-click=\"{{ onCopyLink }}\" style=\"min-height: 44px; height: auto; padding: 11px clamp(15px, 2.8vw, 18px); border: 1px solid rgba(255,255,255,.26); border-radius: 6px; background: rgba(24,22,66,.88); color: #DCE5F0; font-family: var(--font-sans); font-size: 14px; font-weight: 600; cursor: pointer;\" style-hover=\"background: rgba(255,255,255,.12);\">{{ copyLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"display: flex; gap: 12px; flex-wrap: wrap; align-items: center;\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ onHostStart }}\" style=\"min-height: 50px; height: auto; padding: 13px clamp(20px, 3.6vw, 28px); border: none; border-radius: 6px; background: #4970AE; color: #FFFFFF; font-family: var(--font-sans); font-size: 16px; font-weight: 600; cursor: pointer; transition: background 150ms ease, transform 100ms ease;\" style-hover=\"background: #40639B;\" style-active=\"background: #355492; transform: scale(.98);\">{{ hostStartLabel }}<\u002Fbutton>\n                  <button type=\"button\" \u002Fdiv>\n\n          <sc-if value=\"{{ showReview }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top: 28px; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; background: rgba(24,22,66,.88); overflow: hidden;\">\n              <sc-for list=\"{{ review }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div style=\"padding: 18px clamp(16px, 3vw, 24px); border-bottom: 1px solid rgba(255,255,255,.10); display: grid; grid-template-columns: 40px 1fr; gap: 16px;\">\n                  <div style=\"font-family: var(--font-mono); font-size: 13px; color: #AEB8CA;\">{{ r.n }}<\u002Fdiv>\n                  <div>\n                    <div style=\"font-size: 16px; font-weight: 600; color: #FFFFFF; line-height: 1.4;\">{{ r.q }}<\u002Fdiv>\n                    <div style=\"font-size: 14px; color: {{ r.color }}; margin-top: 6px;\">{{ r.yours }}<\u002Fdiv>\n                    <div style=\"font-size: 14px; color: #DCE5F0; margin-top: 2px;\">{{ r.right }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n\n\n    \n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;secondsPerQuestion&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:30,&quot;min&quot;:10,&quot;max&quot;:90,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Gameplay&quot;},&quot;pointsPerCorrect&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1000,&quot;min&quot;:100,&quot;max&quot;:2000,&quot;step&quot;:100,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Gameplay&quot;},&quot;revealCorrectAnswer&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Gameplay&quot;},&quot;strictMode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Anti-cheat&quot;}}\">\nconst EASY = ['Culture', 'English', 'Recognition'];\nconst HARD = ['IT', 'Project', 'ACDC'];\nconst ALL_TAGS = EASY.concat(HARD);\n\nconst SECTIONS = [\n  {\n    eyebrow: 'Round one of two',\n    title: 'Warm up under the lanterns',\n    blurb: 'All six topics, mixed together and starting gentle. Festival customs sit beside engineering and delivery, so expect the subject to change every question.',\n    tags: ALL_TAGS,\n    cta: 'Begin round one'\n  },\n  {\n    eyebrow: 'Round two of two',\n    title: 'Same six topics, sharper questions',\n    blurb: 'The second half of every topic, still rotating. Tighter questions, same thirty seconds on the clock.',\n    tags: ALL_TAGS,\n    cta: 'Begin round two'\n  }\n];\n\nconst QUESTIONS = [\n {\n  \"n\": 1,\n  \"g\": \"Culture\",\n  \"q\": \"The Mid-Autumn Festival falls on the fifteenth day of which lunar month?\",\n  \"a\": [\n   \"The first\",\n   \"The eighth\",\n   \"The seventh\",\n   \"The ninth\"\n  ]\n },\n {\n  \"n\": 2,\n  \"g\": \"Culture\",\n  \"q\": \"Which English name is most commonly used for the Mid-Autumn Festival?\",\n  \"a\": [\n   \"Spring Festival\",\n   \"Dragon Festival\",\n   \"Star Festival\",\n   \"Moon Festival\"\n  ]\n },\n {\n  \"n\": 3,\n  \"g\": \"Culture\",\n  \"q\": \"What is a \\\"đèn kéo quân\\\" called in English?\",\n  \"a\": [\n   \"A revolving lantern\",\n   \"A floating candle\",\n   \"A paper fan\",\n   \"A hanging drum\"\n  ]\n },\n {\n  \"n\": 4,\n  \"g\": \"Culture\",\n  \"q\": \"In Japan, the custom of admiring the autumn moon is known as:\",\n  \"a\": [\n   \"Obon\",\n   \"Tsukimi\",\n   \"Chuseok\",\n   \"Hanami\"\n  ]\n },\n {\n  \"n\": 5,\n  \"g\": \"Culture\",\n  \"q\": \"Vietnamese \\\"bánh dẻo\\\" is made mainly from which ingredient?\",\n  \"a\": [\n   \"Corn starch\",\n   \"Wheat flour\",\n   \"Glutinous rice flour\",\n   \"Almond powder\"\n  ]\n },\n {\n  \"n\": 6,\n  \"g\": \"Culture\",\n  \"q\": \"The full moon at this festival is most often taken as a symbol of:\",\n  \"a\": [\n   \"Wealth and status\",\n   \"Courage in battle\",\n   \"A fresh start\",\n   \"Reunion and completeness\"\n  ]\n },\n {\n  \"n\": 7,\n  \"g\": \"English\",\n  \"q\": \"Which sentence is grammatically correct?\",\n  \"a\": [\n   \"By the time we launched, we fix every critical bug.\",\n   \"By the time we launched, we had fixed every critical bug.\",\n   \"By the time we launched, we are fixing every critical bug.\",\n   \"By the time we launched, we have fixed every critical bug.\"\n  ]\n },\n {\n  \"n\": 8,\n  \"g\": \"English\",\n  \"q\": \"In business English, \\\"to escalate an issue\\\" means to:\",\n  \"a\": [\n   \"Raise it to a higher level of authority\",\n   \"Make it worse on purpose\",\n   \"Solve it yourself immediately\",\n   \"Close it without any action\"\n  ]\n },\n {\n  \"n\": 9,\n  \"g\": \"English\",\n  \"q\": \"Complete: \\\"If we ___ the scope earlier, we would have met the deadline.\\\"\",\n  \"a\": [\n   \"had reduced\",\n   \"would reduce\",\n   \"have reduced\",\n   \"reduced\"\n  ]\n },\n {\n  \"n\": 10,\n  \"g\": \"English\",\n  \"q\": \"Which phrasal verb means \\\"to postpone something\\\"?\",\n  \"a\": [\n   \"To put it down\",\n   \"To put it through\",\n   \"To put it across\",\n   \"To put it off\"\n  ]\n },\n {\n  \"n\": 11,\n  \"g\": \"English\",\n  \"q\": \"Which word is closest in meaning to \\\"feasible\\\"?\",\n  \"a\": [\n   \"Fragile\",\n   \"Practical\",\n   \"Optional\",\n   \"Temporary\"\n  ]\n },\n {\n  \"n\": 12,\n  \"g\": \"English\",\n  \"q\": \"\\\"A steep learning curve\\\" describes something that is:\",\n  \"a\": [\n   \"Easy to master\",\n   \"Cheap to build\",\n   \"Difficult to learn quickly\",\n   \"Slow to run\"\n  ]\n },\n {\n  \"n\": 13,\n  \"g\": \"IT\",\n  \"q\": \"What does \\\"API\\\" stand for?\",\n  \"a\": [\n   \"Application Programming : \"Ticking \\\"Tag this as an AI-learning moment\\\" adds how many points to that person?\",\n  \"a\": [\n   \"15 points\",\n   \"5 points\",\n   \"25 points\",\n   \"10 points\"\n  ]\n },\n {\n  \"n\": 29,\n  \"g\": \"Recognition\",\n  \"q\": \"Logging \\\"Built an AI tool\\\" adds how many points to your AI Learning KPI?\",\n  \"a\": [\n   \"25 points\",\n   \"15 points\",\n   \"20 points\",\n   \"5 points\"\n  ]\n },\n {\n  \"n\": 30,\n  \"g\": \"ACDC\",\n  \"q\": \"What does ACDC stand for?\",\n  \"a\": [\n   \"Agile Continuous Deployment Cycle\",\n   \"Automated Code Delivery Chain\",\n   \"Agent-Centric Development Cycle\",\n   \"Agent Control and Debug Console\"\n  ]\n },\n {\n  \"n\": 31,\n  \"g\": \"ACDC\",\n  \"q\": \"In ACDC, which three agents run in parallel after the plan is approved?\",\n  \"a\": [\n   \"ui-ux-designer, docs-manager, tester\",\n   \"backend-engineer, frontend-engineer, tester\",\n   \"tech-lead, debugger, code-reviewer\",\n   \"engineer, tester, docs-manager\"\n  ]\n },\n {\n  \"n\": 32,\n  \"g\": \"ACDC\",\n  \"q\": \"In ACDC, how do agents pass information to each other?\",\n  \"a\": [\n   \"Through shared conversation memory\",\n   \"Through email notifications\",\n   \"Through files on disk\",\n   \"Through a central database\"\n  ]\n },\n {\n  \"n\": 33,\n  \"g\": \"ACDC\",\n  \"q\": \"In ACDC, when a prompt and a file disagree, which one wins?\",\n  \"a\": [\n   \"The file\",\n   \"Whichever is newer\",\n   \"The orchestrator picks at random\",\n   \"The prompt\"\n  ]\n },\n {\n  \"n\": 34,\n  \"g\": \"ACDC\",\n  \"q\": \"In this photo, the EGS uniform shirt is from which year?\",\n  \"a\": [\n   \"2014\",\n   \"2018\",\n   \"2016\",\n   \"2020\"\n  ],\n  \"img\": \"assets/q-ao2016.jpg\"\n },\n {\n  \"n\": 35,\n  \"g\": \"ACDC\",\n  \"q\": \"In the ACDC status protocol, what does BLOCKED mean?\",\n  \"a\": [\n   \"The pipeline continues as normal\",\n   \"The task is finished\",\n   \"Something must be changed before work continues\",\n   \"The agent needs more context, then retries\"\n  ]\n },\n {\n  \"n\": 36,\n  \"g\": \"ACDC\",\n  \"q\": \"On which date is International Men's Day?\",\n  \"a\": [\n   \"6 April\",\n   \"13 April\",\n   \"19 November\",\n   \"20 November\"\n  ]\n }\n];\n\nconst TEST_QUESTIONS = [\n {\n  \"n\": 101,\n  \"g\": \"Culture\",\n  \"q\": \"How many legs does a normal chair have?\",\n  \"a\": [\n   \"Three\",\n   \"Four\",\n   \"Seven\",\n   \"A chair does not have legs\"\n  ]\n },\n {\n  \"n\": 102,\n  \"g\": \"Culture\",\n  \"q\": \"What colour is a green mooncake?\",\n  \"a\": [\n   \"Blue\",\n   \"Green\",\n   \"Red\",\n   \"Nobody knows\"\n  ]\n },\n {\n  \"n\": 103,\n  \"g\": \"Culture\",\n  \"q\": \"What is 2 + 2?\",\n  \"a\": [\n   \"22\",\n   \"4\",\n   \"5\",\n   \"A rabbit\"\n  ]\n },\n {\n  \"n\": 104,\n  \"g\": \"Culture\",\n  \"q\": \"The moon is made of what?\",\n  \"a\": [\n   \"Cheese\",\n   \"Rock\",\n   \"Mooncake\",\n   \"Wi-Fi\"\n  ]\n },\n {\n  \"n\": 105,\n  \"g\": \"Culture\",\n  \"q\": \"How many rabbits are in a pair of rabbits?\",\n  \"a\": [\n   \"One\",\n   \"Two\",\n   \"Three\",\n   \"Depends on the season\"\n  ]\n },\n {\n  \"n\": 106,\n  \"g\": \"IT\",\n  \"q\": \"What do you press to type a space?\",\n  \"a\": [\n   \"The space bar\",\n   \"Ctrl\",\n   \"Escape\",\n   \"The monitor\"\n  ]\n },\n {\n  \"n\": 107,\n  \"g\": \"IT\",\n  \"q\": \"What is the first step to fix any computer?\",\n  \"a\": [\n   \"Turn it off and on again\",\n   \"Buy a new one\",\n   \"Blame the intern\",\n   \"Shout at it\"\n  ]\n },\n {\n  \"n\": 108,\n  \"g\": \"IT\",\n  \"q\": \"Which of these is a real programming language?\",\n  \"a\": [\n   \"Python\",\n   \"Anaconda\",\n   \"Boa\",\n   \"Cobra Kai\"\n  ]\n },\n {\n  \"n\": 109,\n  \"g\": \"IT\",\n  \"q\": \"How many bugs are in a bug-free release?\",\n  \"a\": [\n   \"Zero\",\n   \"One\",\n   \"Ten\",\n   \"Ask again after launch\"\n  ]\n },\n {\n  \"n\": 110,\n  \"g\": \"IT\",\n  \"q\": \"Where  const podium = [0, 1, 2].filter(i => ranked[i]).map(i => {\n      const mine = i === myIdx;\n      return {\n        place: medals[i].place,\n        border: mine ? '#5D3CB0' : medals[i].border,\n        bg: mine ? 'rgba(93,60,176,.42)' : medals[i].bg,\n        height: medals[i].height,\n        name: ranked[i].name,\n        score: (ranked[i].score || 0).toLocaleString('en-US') + ' pts',\n        time: this.fmt(ranked[i].time_ms || 0),\n        note: mine ? 'That is you. Congratulations.' : medals[i].note\n      };\n    });\n\n    return {\n      isDash: s.dashMode,\n      dashHref: '#dash=' + s.roomCode,\n      dashCode: s.roomCode,\n      dashLink: this.shareLink(s.roomCode),\n      dashRows: dashRows,\n      dashEmpty: !dashRows.length,\n      dashEmptyNote: s.room\n        ? 'Waiting for the first answer. Names appear as people join.'\n        : 'No room with that code yet. The host opens it first.',\n      dashStats: [\n        { label: 'In the room', value: String(s.players.length) },\n        { label: 'Playing now', value: String(s.players.filter(p => (p.answered || 0) > 0 && !p.finished_at).length) },\n        { label: 'Finished', value: String(s.players.filter(p => p.finished_at).length) }\n      ],\n      dashState: !s.room ? 'Waiting for the host'\n        : (s.room.started_at ? 'Round in progress' : 'In the lobby'),\n      soundOn: s.sound,\n      soundOff: !s.sound,\n      soundLabel: s.sound ? 'Sound on' : 'Sound off',\n      onSound: this.toggleSound,\n      showReconnect: s.netStatus === 'disconnected',\n      reconnectLabel: s.netStatus === 'disconnected' ? 'Reconnecting…' : '',\n      isCover: s.phase === 'lobby' && !s.joined && !s.hosting,\n      isRoster: s.phase === 'lobby' && (s.joined || s.hosting),\n      coverEyebrow: 'One round · ' + (totalQ || 36) + (s.testMode ? ' practice questions' : ' questions'),\n      statusLabel: s.online ? '' : 'Offline mode — only this browser sees the room.',\n      isCountdown: s.phase === 'countdown',\n      isPlaying: s.phase === 'playing',\n      isResults: s.phase === 'results',\n\n      name: s.name,\n      lobbyHint: s.hint || (s.hostMode\n        ? 'You are the host. Pick any room code, or leave it blank for a random one.'\n        : ''),\n      onName: e => this.setState({ name: e.target.value, hint: '' }),\n      onNameKey: e => { if (e.key === 'Enter') { (s.hostMode || !s.codeInput.trim()) ? this.create() : this.join(); } },\n      onCode: e => this.setState({ codeInput: e.target.value.toUpperCase(), hint: '' }),\n      codeInput: s.codeInput,\n      onCreate: this.create, onJoin: this.join, onLeave: this.leave,\n      onFreshRoom: () => {\n        if (this.unwatch) this.unwatch();\n        this.setHash(s.hostMode ? ('host' + (s.testMode ? '&test' : '')) : '');\n        this.setState({ roomCode: '', room: null, players: [], joined: false, hosting: false, codeInput: '', hint: '' });\n      },\n      canHost: s.hostMode && !s.joined && !s.hosting,\n      isGuestCover: !s.hostMode,\n      primaryLabel: s.hostMode\n        ? (s.codeInput.trim() ? 'Open room ' + s.codeInput.trim().toUpperCase() : 'Open the room')\n        : 'Join the room',\n      onPrimary: s.hostMode ? this.create : this.join,\n      hostLinkNote: 'Host link: add #host to the end of the page address.',\n      liveBoard: live,\n      guidelines: [\n        { n: '01', text: 'Chọn 1 trong 4 đáp án cho mỗi câu — mỗi câu chỉ được chọn một lần.' },\n        { n: '02', text: 'Đáp án đúng chỉ hiện sau khi hết 30 giây, dù bạn trả lời nhanh hay chậm.' },\n        { n: '03', text: 'Điểm số hiện ngay trên đầu màn hình sau mỗi câu.' },\n        { n: '04', text: '36 câu liền một mạch, không dừng giữa chừng — rời tab sẽ mất câu đó.' },\n        { n: '05', text: 'Xếp hạng của bạn hiện sau mỗi câu, để biết mình đang ở đâu.' }\n      ],\n      liveCount: live.length + (live.length === 1 ? ' player' : ' players') + ' in this round',\n      showLive: live.length > 1 && s.stage === 'answering',\n      rankingRows,\n      myRankLabel: myLiveIdx >= 0 ? 'You are #' + (myLiveIdx + 1) + ' of ' + liveSorted.length : 'Waiting for your score…',\n      joined: s.joined,\n      joinedLabel: 'You are in, ' + s.name.trim() + '.',\n      waitLabel: 'Hold tight. The round begins the moment the host starts it.',\n      isHost, roomCode: s.roomCode,\n      onCopyLink: this.copyLink,\n      copyLabel: s.copied ? 'Link copied' : 'Copy link and code',\n      onHostStart: this.hostStart, onHostReset: this.hostReset,\n      hostStartLabel: s.room && s.room.started_at ? 'Restart for everyone' : 'Start for everyone',\n      testBadge: s.testMode ? 'Practice set · 10 silly questions' : '',\n      hostHint: s.players.length\n        ? 'You run the room, you do not play. Starting resets every score and launches the countdown on all player screens.'\n        : 'Send the link and the code, then wait for names to appear. You are hosting, not playing.',\n      roster,\n      roosterCount: s.players.length + (s.players.length === 1 ? ' player' : ' players'),\n      rosterFoot: !s.online\n        ? 'Offline mode: only this browser can see the room.'\n        : (s.room && s.room.started_at\n          ? 'The game is running. Joining now drops you straight in.'\n          : 'Everyone in this list starts at the same moment.'),\n\n      countdown: s.countdown,\n\n      progressLabel: 'Question ' + (s.idx + 1) + ' of ' + (listLen || 36),\n      sectionBadge: 'Mid-Autumn Quiz',\n      groupLabel: q ? q.g : '',\n      scoreLabel: s.score.toLocaleString('en-US') + ' pts',\n      secondsLeft: left, timePct: pct,\n      clockColor: left <= 5 ? '#F2A93B' : '#FFFFFF',\n      questionText: q ? q.q : 'Loading…',\n      // A question can carry an image by adding \"img\": \"assets/<file>\" to its\n      // entry in the quiz bank. Text-only questions are unaffected.\n      questionImageEl: q && q.img ? React.createElement('img', {\n        src: q.img, alt: '', onError: e => { e.target.style.display = 'none'; },\n        style: { display: 'block', width: '100%', maxWidth: 520, maxHeight: '34vh', objectFit: 'contain',\n          margin: 'clamp(14px, 2vw, 20px) auto 0', borderRadius: 10, border: '1px solid rgba(255,255,255,.14)' }\n      }) : null,\n      o0: opts[0], o1: opts[1], o2: opts[2], o3: opts[3],\n      op0: t[0].op, op1: t[1].op, op2: t[2].op, op3: t[3].op,\n      sh0: t[0].sh, sh1: t[1].sh, sh2: t[2].sh, sh3: t[3].sh,\n      pick0: () => this.pick(0), pick1: () => this.pick(1), pick2: () => this.pick(2), pick3: () => this.pick(3),\n      locked, verdictText: verdict, verdictColor: vColor,\n      playerLabel: s.name.trim() ? 'Playing as ' + s.name.trim() : '',\n      canAdvance: false,\n      nextLabel: s.idx >= listLen - 1 ? 'See results' : 'Next question',\n      speedNote: revealing\n        ? ''\n        : 'Answer sooner or later, it is scored the same way — everyone waits for the clock either way.',\n      isAnswering: s.phase === 'playing' && (s.stage === 'answering' || s.stage === 'reveal'),\n      isRanking: s.phase === 'playing' && s.stage === 'ranking',\n      onNext: this.next,\n      blockMenu: e => e.preventDefault(),\n\n      finalScore: s.score.toLocaleString('en-US'),\n      finalSummary: s.correctCount + ' of ' + (totalQ || 36) + ' answered correctly',\n      finalTime: 'Total answering time ' + this.fmt(s.timeMs),\n      rankLabel: myIdx >= 0 ? 'You placed #' + (myIdx + 1) + ' — points first, then time' : '',\n      podium, board,\n      boardCountLabel: ranked.length\n        ? ranked.length + (ranked.length === 1 ? ' result in' : ' results in') +\n          (s.players.length > ranked.length ? ' · ' + (s.players.length - ranked.length) + ' still playing' : '')\n        : 'No results yet',\n      onAgain: () => this.setState({ phase: 'lobby', hint: '', showReview: false }),\n      reviewLabel: s.showReview ? 'Hide answer review' : 'Review answers',\n      onReview: () => this.setState(x => ({ showReview: !x.showReview })),\n      showReview: s.showReview,\n      review: s.log.map(r => ({\n        n: String(r.n).padStart(2, '0'), q: r.q,\n        yours: 'Your answer: ' + r.yours,\n        right: r.ok === null ? 'Not scored — no connection' : (r.ok ? '' : 'Correct answer: ' + r.right),\n        color: r.ok === null ? '#F2A93B' : (r.ok ? '#5BD6AB' : '#FF8B8B')\n      })),\n      onClearBoard: () => {\n        if (!window.confirm('Clear every score in this room?')) return;\n        if (this.store && s.roomCode) this.store.resetRound(s.roomCode).then(() => this.pull()).catch(() => {});\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
